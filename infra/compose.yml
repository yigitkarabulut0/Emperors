name: emperors

services:
  api:
    image: ghcr.io/yigitkarabulut0/emperors-api:${EMPERORS_VERSION:-latest}
    restart: unless-stopped
    env_file: [./secrets.env]
    environment:
      EMPERORS_ENV: prod
      EMPERORS_ADDR: ":8080"
    # No ports: mapping. Only Caddy may reach the API, and it does so over the
    # internal network by service name.
    networks: [edge]
    healthcheck:
      # distroless has no shell and no curl, so the binary checks itself.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    # The Caddyfile reads {$EMPERORS_DOMAIN} and {$CADDY_EMAIL} from the
    # CONTAINER's environment. compose's own .env only substitutes into this
    # file, so without passing them through Caddy saw empty strings and refused
    # to start with "wrong argument count ... after 'email'".
    environment:
      EMPERORS_DOMAIN: ${EMPERORS_DOMAIN:?set EMPERORS_DOMAIN in infra/.env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates — losing this re-issues and can hit rate limits
      - caddy_config:/config
    networks: [edge]
    depends_on: [api]

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
