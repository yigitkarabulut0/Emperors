name: emperors

services:
  api:
    image: ghcr.io/yigitkarabulut0/emperors-api:${EMPERORS_VERSION:-latest}
    restart: unless-stopped
    env_file: [./secrets.env]
    environment:
      EMPERORS_ENV: prod
      EMPERORS_ADDR: ":8080"
    # The game API has no ports mapping. Only Caddy may reach it, and it does so
    # over the internal network by service name.
    #
    # The admin listener is published on LOOPBACK ONLY, so it is reachable from
    # the host and from nowhere else -- not from the internet, and not from any
    # other machine. An operator gets to it with an SSH tunnel:
    #
    #   ssh -N -L 8081:127.0.0.1:8081 -i ~/.ssh/emperors_deploy root@<ip>
    #
    # That is what lets the panel watch the process the phones are actually
    # talking to. Presence lives in that process's memory, so a panel pointed at
    # a locally-run server would show an empty board forever and be correct to.
    # Caddy still has no route to 8081, so "nothing that can grant currency
    # shares a listener with the game API" is untouched.
    ports: ["127.0.0.1:8081:8081"]
    networks: [edge]
    healthcheck:
      # distroless has no shell and no curl, so the binary checks itself.
      test: ["CMD", "/api", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    # The Caddyfile reads {$EMPERORS_DOMAIN} and {$CADDY_EMAIL} from the
    # CONTAINER's environment. compose's own .env only substitutes into this
    # file, so without passing them through Caddy saw empty strings and refused
    # to start with "wrong argument count ... after 'email'".
    environment:
      EMPERORS_DOMAIN: ${EMPERORS_DOMAIN:?set EMPERORS_DOMAIN in infra/.env}
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates — losing this re-issues and can hit rate limits
      - caddy_config:/config
    networks: [edge]
    depends_on: [api]

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:
