<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.Title}} · Emperors</title>
<style>
:root {
  --ground: #0b151f; --panel: #122232; --ink: #e9e2d0; --dim: #b8b09c;
  --gold: #d9b45a; --rule: rgba(217, 180, 90, 0.28);
}
@media (prefers-color-scheme: light) {
  :root { --ground: #f6f1e6; --panel: #fffaf0; --ink: #1d2733; --dim: #56606b; --gold: #8a6614; --rule: rgba(138, 102, 20, 0.3); }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 17px/1.6 Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  padding-block: 32px 64px; padding-inline: 20px;
}
main { max-width: 42em; margin: 0 auto; }
header { border-bottom: 1px solid var(--rule); margin-bottom: 28px; padding-bottom: 18px; }
.mark { color: var(--gold); letter-spacing: 0.22em; font-size: 13px; text-transform: uppercase; }
h1 { font-weight: 400; font-size: 32px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: 0.02em; }
.updated { color: var(--dim); font-size: 14px; }
h2 { font-weight: 400; font-size: 21px; color: var(--gold); margin: 34px 0 8px; letter-spacing: 0.03em; }
p, li { color: var(--ink); }
ul { padding-left: 1.2em; }
li { margin: 4px 0; }
.note { background: var(--panel); border-left: 2px solid var(--gold); padding: 12px 16px; margin: 18px 0; }
a { color: var(--gold); }
footer { margin-top: 48px; border-top: 1px solid var(--rule); padding-top: 16px; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<main>
<header>
<div class="mark">Emperors</div>
<h1>{{.Title}}</h1>
<div class="updated">Last updated {{.Updated}}</div>
</header>
{{.Body}}
<footer>
<a href="terms">Terms of Use</a> · <a href="privacy">Privacy Policy</a>
</footer>
</main>
</body>
</html>
